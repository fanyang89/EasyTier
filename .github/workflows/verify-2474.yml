name: Verify Windows relay route fix
on:
  push:
    branches: [test/2474-product-windows]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 50
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-build
        with:
          gui: false
          pnpm: false
          token: ${{ github.token }}
      - uses: actions/checkout@v4
        with:
          ref: 397146eaa1ba2468cadcb7f4cb5dad1395f39904
          path: fixture-src
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - name: Build changed product
        shell: bash
        run: |
          cargo test -p easytier --lib --locked --no-run
          cargo build -p easytier --bin easytier-core --bin easytier-cli --locked
      - name: Verify scoped host routes on two Wintun adapters
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $pwd.Path
          $dir = "$root\fixture-src\script\windows-route-control"
          Push-Location $dir
          go build -o fixture.exe .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item "$root\easytier\third_party\x86_64\wintun.dll" .
          $env:PATH = "$root\easytier\third_party\x86_64;$env:PATH"
          $procs = @()
          try {
            foreach ($name in 'LabUnder','LabAlt') {
              $p = Start-Process .\fixture.exe -ArgumentList $name -PassThru -NoNewWindow -RedirectStandardOutput "$name.out" -RedirectStandardError "$name.err"
              $procs += $p
              $deadline = (Get-Date).AddSeconds(30)
              while (!(Select-String -Quiet -SimpleMatch "ready $name" "$name.out")) {
                if ($p.HasExited -or (Get-Date) -gt $deadline) { throw "Fixture not ready: $name" }
                Start-Sleep -Milliseconds 200
              }
            }
            New-NetIPAddress -InterfaceAlias LabUnder -IPAddress 198.18.247.2 -PrefixLength 16 -PolicyStore ActiveStore
            New-NetIPAddress -InterfaceAlias LabAlt -IPAddress 198.19.247.2 -PrefixLength 24 -PolicyStore ActiveStore
            New-NetRoute -InterfaceAlias LabAlt -DestinationPrefix 198.18.247.0/24 -NextHop 0.0.0.0 -PolicyStore ActiveStore
            New-NetRoute -InterfaceAlias LabUnder -DestinationPrefix 198.18.247.44/32 -NextHop 0.0.0.0 -RouteMetric 18 -PolicyStore ActiveStore
            Set-Location $root
            cargo test --locked -p easytier --lib common::ifcfg::relay_routes::tests::relay_host_route_lifecycle -- --ignored --exact --nocapture | Tee-Object test.log
            if ($LASTEXITCODE -or !(Select-String -Quiet '1 passed; 0 failed' test.log)) { throw 'Lifecycle test failed' }
            Remove-NetRoute -InterfaceAlias LabAlt -DestinationPrefix 198.18.247.0/24 -Confirm:$false
            $exe = "$root\target\debug\easytier-core.exe"
            $cli = "$root\target\debug\easytier-cli.exe"
            $common = @('--network-name','lab','--disable-ipv6','true','--disable-p2p','true','--bind-device','false')
            $procs += Start-Process $exe -ArgumentList ($common + @('--instance-name','peerC','--no-tun','true','-l','wss://127.0.0.1:29444','-r','25101')) -RedirectStandardOutput C.log -RedirectStandardError C.err -PassThru
            $b = Start-Process $exe -ArgumentList ($common + @('--instance-name','peerB','--dev-name','ET2474','-i','10.77.0.2','--no-listener','-p','wss://198.18.247.42:24444','-r','25102')) -RedirectStandardOutput B.log -RedirectStandardError B.err -PassThru
            $procs += $b
            function connection {
              $json = (& $cli -p 127.0.0.1:25102 -v peer list 2>$null | Out-String)
              if ($json -match '"conn_id"\s*:\s*"([^"]+)"') { return $Matches[1] }
            }
            $deadline = (Get-Date).AddSeconds(60)
            while (!($id = connection)) {
              if ($b.HasExited -or (Get-Date) -gt $deadline) { throw 'B-C WSS not ready' }
              Start-Sleep 1
            }
            $procs += Start-Process $exe -ArgumentList ($common + @('--instance-name','peerA','--no-tun','true','--no-listener','-p','wss://127.0.0.1:29444','-n','198.18.247.0/24','-r','25103')) -RedirectStandardOutput A.log -RedirectStandardError A.err -PassThru
            $deadline = (Get-Date).AddSeconds(60)
            while (!(Get-NetRoute -DestinationPrefix 198.18.247.0/24 -InterfaceAlias ET2474 -ErrorAction SilentlyContinue)) {
              if ((Get-Date) -gt $deadline) { throw 'No proxy advertisement installed' }
              Start-Sleep 1
            }
            foreach ($i in 1..15) {
              $r = Get-NetRoute -DestinationPrefix 198.18.247.42/32 -InterfaceAlias LabUnder
              if (!$r -or (connection) -ne $id) { throw 'Lost relay or route' }
              Start-Sleep 5
            }
            Write-Output "WSS $id survived advertisement and multiple renewals (75 seconds)"
          } finally {
            $procs | Where-Object { !$_.HasExited } | Stop-Process -Force
            Get-Content "$root\B.log","$root\B.err","$root\A.log","$root\C.log" -Tail 12 -ErrorAction SilentlyContinue
          }
